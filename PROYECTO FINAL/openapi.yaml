openapi: 3.0.3
info:
  title: API REST de películas
  version: 1.0.0
  description: "![Portada de la API REST de
    películas](/swagger-assets/swagger-cover.svg)\r

    \r

    ## API REST de películas\r

    \r

    Consulta, crea, actualiza o elimina películas. Esta documentación presenta\r

    las operaciones `GET` y `POST` en `/peliculas/`, y `GET`, `PUT` y `DELETE`\r

    en `/peliculas/{id}`.\r

    \r

    ### Autenticación\r

    \r

    La ruta requiere una API key. Pulsa **Authorize** y escribe el valor de\r

    `API_KEY` configurado en el archivo `.env`. Swagger lo enviará en el
    encabezado\r

    `x-api-key`.\r

    \r

    ### Horario del servicio\r

    \r

    El servidor acepta solicitudes de lunes a sábado, de 06:00 a 19:59, según
    su\r

    hora local. Fuera de ese horario responde con HTTP `503`."
servers:
  - url: https://localhost:3000
    description: Servidor local HTTPS
paths:
  /peliculas/:
    post:
      tags:
        - Películas
      summary: Registrar una nueva película
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PeliculaInput"
      responses:
        "201":
          description: Película creada exitosamente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pelicula"
        "400":
          description: Datos de entrada inválidos.
        "401":
          description: API key inválida o faltante.
    get:
      tags:
        - Películas
      summary: Listar y filtrar películas
      security:
        - ApiKeyAuth: []
      parameters:
        - name: titulo
          in: query
          schema:
            type: string
          example: matrix
        - name: director
          in: query
          schema:
            type: string
          example: nolan
        - name: anio
          in: query
          schema:
            type: integer
          example: 2010
      responses:
        "200":
          description: Lista de películas.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Pelicula"
        "404":
          description: No se encontraron películas.
  /peliculas/{id}:
    get:
      tags:
        - Películas
      summary: Buscar película por ID
      security:
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Película encontrada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pelicula"
        "400":
          description: El ID no es un número válido.
        "404":
          description: Película no encontrada.
    put:
      tags:
        - Películas
      summary: Actualizar una película existente
      security:
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PeliculaInput"
      responses:
        "200":
          description: Película actualizada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pelicula"
        "400":
          description: ID o datos inválidos.
        "404":
          description: Película no encontrada.
    delete:
      tags:
        - Películas
      summary: Eliminar una película por ID
      security:
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Película eliminada correctamente (sin contenido).
        "400":
          description: El ID no es un número válido.
        "404":
          description: Película no encontrada.
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: Usa el valor configurado en la variable de entorno API_KEY.
  schemas:
    PeliculaInput:
      type: object
      required:
        - titulo
        - director
        - anio
      properties:
        titulo:
          type: string
          example: Dune
        director:
          type: string
          example: Denis Villeneuve
        anio:
          type: integer
          example: 2021
    Pelicula:
      allOf:
        - $ref: "#/components/schemas/PeliculaInput"
        - type: object
          properties:
            id:
              type: integer
              example: 1
            link:
              type: string
              format: uri
              example: https://localhost:3000/peliculas/1
    Error:
      type: object
      required:
        - mensaje
      properties:
        mensaje:
          type: string
          example: Película no encontrada
tags:
  - name: Películas
    description: Consulta, creación, actualización y eliminación de películas.
