openapi: 3.0.3
info:
  title: API REST de películas
  version: 1.0.0
  description: "![Portada de la API REST de
    películas](/swagger-assets/swagger-cover.svg)\r

    \r

    ## API REST de películas\r

    \r

    Consulta una película usando su identificador. Esta documentación presenta\r

    las operaciones `GET /peliculas/` (listar y filtrar) y `GET
    /peliculas/{id}`\r

    (buscar por identificador).\r

    \r

    ### Autenticación\r

    \r

    La ruta requiere una API key. Pulsa **Authorize** y escribe el valor de\r

    `API_KEY` configurado en el archivo `.env`. Swagger lo enviará en el
    encabezado\r

    `x-api-key`.\r

    \r

    ### Horario del servicio\r

    \r

    El servidor acepta solicitudes de lunes a sábado, de 06:00 a 19:59, según
    su\r

    hora local. Fuera de ese horario responde con HTTP `503`."
servers:
  - url: https://localhost:3000
    description: Servidor local HTTPS
paths:
  /peliculas/:
    get:
      tags:
        - Películas
      summary: Listar y filtrar películas
      description: >
        ### cURL

        ```bash

        curl -k "https://localhost:3000/peliculas/?titulo=matrix" -H "x-api-key:
        TU_API_KEY"

        ```


        ### JavaScript

        ```js

        fetch("https://localhost:3000/peliculas/?titulo=matrix", {
          headers: { "x-api-key": "TU_API_KEY" }
        })
          .then((respuesta) => respuesta.json())
          .then((peliculas) => console.log(peliculas));
        ```
      security:
        - ApiKeyAuth: []
      parameters:
        - name: titulo
          in: query
          schema:
            type: string
          example: matrix
        - name: director
          in: query
          schema:
            type: string
          example: nolan
        - name: anio
          in: query
          schema:
            type: integer
          example: 2010
      responses:
        "200":
          description: Lista de películas.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Pelicula"
        "401":
          description: API key inválida o faltante.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No se encontraron películas.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Fuera del horario de servicio.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /peliculas/{id}:
    get:
      tags:
        - Películas
      summary: Buscar película por ID
      description: |
        ### cURL
        ```bash
        curl -k "https://localhost:3000/peliculas/1" -H "x-api-key: TU_API_KEY"
        ```

        ### JavaScript
        ```js
        fetch("https://localhost:3000/peliculas/1", {
          headers: { "x-api-key": "TU_API_KEY" }
        })
          .then((respuesta) => respuesta.json())
          .then((pelicula) => console.log(pelicula));
        ```
      security:
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Película encontrada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pelicula"
        "400":
          description: El ID no es un número válido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: API key inválida o faltante.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Película no encontrada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Fuera del horario de servicio.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: Usa el valor configurado en la variable de entorno API_KEY.
  schemas:
    Pelicula:
      type: object
      required:
        - id
        - titulo
        - director
        - anio
        - link
      properties:
        id:
          type: integer
          example: 1
        titulo:
          type: string
          example: Inception
        director:
          type: string
          example: Christopher Nolan
        anio:
          type: integer
          example: 2010
        link:
          type: string
          format: uri
          example: https://localhost:3000/peliculas/1
    Error:
      type: object
      required:
        - mensaje
      properties:
        mensaje:
          type: string
          example: Película no encontrada
tags:
  - name: Películas
    description: Consulta, filtrado y búsqueda de películas.
